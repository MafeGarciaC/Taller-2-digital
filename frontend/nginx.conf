server {
    listen 80;
    client_max_body_size 25m;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: el nombre "backend" se resuelve en cada petición,
    # así Nginx arranca aunque el backend todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
    }
}
